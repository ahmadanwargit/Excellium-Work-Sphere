<style>
:root{--bg:#F5F4F9;--sf:#fff;--tx:#161B24;--mu:#666878;--ln:#E7E5EF;--ac:#6D3FC8;--acs:#F0EAFB;--sb:#111820;--lg:#111820;--sh:0 1px 2px #0e142810,0 8px 24px -12px #0e142824;--ok:#177A45;--oks:#DDF2E5;--wr:#9A6200;--wrs:#FBEFD2;--er:#B3261E;--ers:#FADEDB;--in:#2B5C9E;--ins:#E0EBF8;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1117;--sf:#161B24;--tx:#EDEAF5;--mu:#9A9BB0;--ln:#262C38;--ac:#A583F0;--acs:#2A2140;--sb:#090C11;--lg:#EDEAF5;--sh:0 1px 2px #0006;--ok:#5ACB8B;--oks:#16301F;--wr:#E3A93E;--wrs:#33280F;--er:#F08A82;--ers:#3A1B19;--in:#7FADE8;--ins:#172A42;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}

.hide{display:none!important}
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}

.lform{display:flex;align-items:center;justify-content:center;padding:32px}

.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.roles button{padding:10px;border:1px solid var(--ln);background:var(--sf);border-radius:6px;text-align:left}

.roles button.on{border-color:var(--ac);background:var(--acs)}
label{display:block;font-size:12px;font-weight:500;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--sf)}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.btn{padding:8px 15px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);font-weight:500}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 4px 12px -4px var(--ac)}.btn:hover{filter:brightness(.96)}.btn.d{color:var(--er)}.btn.s{padding:4px 10px;font-size:12px}
.btn.w{width:100%;margin-top:18px;padding:11px}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--sb),#141C3A);color:#AEB7D6;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{color:#fff;font-weight:700;font-size:18px;padding:0 10px 22px;display:flex;align-items:center;gap:10px}.brand:before{content:'';width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7C93FF,#3550E0 60%,#22C3B0)}
aside a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer}
aside a:hover{background:#ffffff12}aside a{border-radius:10px;font-weight:500}aside a.on{background:linear-gradient(90deg,#ffffff24,#ffffff0a);color:#fff;box-shadow:inset 3px 0 0 #7C93FF}
aside svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.me{margin-top:auto;padding:12px 10px;border-top:1px solid #ffffff18;font-size:13px}.me b{color:#fff;display:block}
main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--sf) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.top h2{font-size:18px;font-weight:600}.top .r{display:flex;gap:10px;align-items:center}
.menu{display:none}
.dot{position:relative}.dot i{position:absolute;top:-5px;right:-5px;background:var(--er);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px}
#view{padding:24px 28px;max-width:1280px}
.hd{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px;flex-wrap:wrap}.hd h3{font-size:22px;font-weight:700;letter-spacing:-.02em}.hd p{color:var(--mu)}#view.dashboard>.hd:first-child{background:linear-gradient(120deg,#0E1428,#24348F 60%,#3550E0);color:#fff;padding:26px 30px;border-radius:16px;box-shadow:var(--sh)}#view.dashboard>.hd:first-child p{color:#C9D2F5}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;min-width:0;box-shadow:var(--sh)}
.card h4{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.st{padding:18px 20px;position:relative;overflow:hidden}.st:after{content:'';position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--acs)}.st small{color:var(--mu);display:block;font-weight:500}.st b{font-size:28px;font-weight:700;line-height:1.35;letter-spacing:-.02em;position:relative}.st span{font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--mu);background:var(--bg);padding:9px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:last-child td{border-bottom:0}tr:hover td{background:var(--bg)}td{padding:11px 12px!important}
.bd{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}.bd:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--oks);color:var(--ok)}.wr{background:var(--wrs);color:var(--wr)}.er{background:var(--ers);color:var(--er)}.in{background:var(--ins);color:var(--in)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--mu);white-space:nowrap}.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:500}
.clock{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.clock .t{font-size:38px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--ln);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#22C3B0);border-radius:4px}
.chart{display:flex;align-items:end;gap:10px;height:150px;padding-top:10px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:end;height:100%}
.chart i{display:block;background:linear-gradient(180deg,var(--ac),#22C3B0);border-radius:6px 6px 0 0;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}.li small{color:var(--mu);display:block}
.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acs),var(--bg));border:1px solid var(--ln);color:var(--ac);display:inline-grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.pc{display:flex;gap:12px;align-items:center}
.tg{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.tg input{width:auto}
.mo{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:16px}
.md{background:var(--sf);border-radius:16px;box-shadow:0 24px 60px -12px #0008;width:100%;max-width:460px;padding:22px;max-height:90vh;overflow:auto}.md h4{font-size:17px;margin-bottom:4px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#np{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:var(--sf);border-left:1px solid var(--ln);z-index:15;padding:18px;overflow:auto;transform:translateX(100%);transition:transform .2s}#np.open{transform:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:6px;z-index:30}
@media(max-width:820px){#login{grid-template-columns:1fr}.lhero{display:none}#app{grid-template-columns:1fr}aside{position:fixed;z-index:12;width:240px;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.menu{display:inline-block}.top,#view{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
aside{background:linear-gradient(180deg,#111820,#1B1633)}aside a.on{box-shadow:inset 3px 0 0 #8B5CF6}
.brand{padding:0 10px 24px}.brand:before{display:none}
#view.dashboard>.hd:first-child{background:linear-gradient(120deg,#111820,#3B2480 60%,#6D3FC8)}#view.dashboard>.hd:first-child p{color:#DCD2F5}
.chart i{background:linear-gradient(180deg,#6D3FC8,#A78BFA)}.bar i{background:linear-gradient(90deg,#6D3FC8,#A78BFA)}
.lhero{background:radial-gradient(circle at 15% 95%,#6D3FC866,transparent 55%),radial-gradient(circle at 90% 8%,#A78BFA2e,transparent 45%),#111820}
.brand,.lhero{--lg:#fff}.lg{fill:var(--lg)}
.logo{display:flex;align-items:center;gap:11px}.logo svg{height:34px;width:auto;flex:none}.logo b{display:block;font:700 17px/1 Montserrat,sans-serif;letter-spacing:.02em;color:var(--lg)}.logo small{display:block;font:500 8.5px/1 Montserrat,sans-serif;letter-spacing:.3em;color:var(--lg);margin-top:6px;opacity:.85}.lhero .logo svg{height:48px}.lhero .logo b{font-size:23px}.lhero .logo small{font-size:11px}
#lk{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--sb) 78%,transparent);backdrop-filter:blur(14px);display:grid;place-items:center;padding:16px}#lk .md{max-width:400px;text-align:center}#lk label{text-align:left}#wn{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:25;background:var(--wrs);color:var(--wr);border:1px solid var(--wr);padding:9px 18px;border-radius:10px;font-weight:600;max-width:92vw}
</style></head><body>
<div id="login"><div class="lhero"><div id="ll"></div><div><h1>One workspace for attendance, pay, performance and equipment.</h1><p>Sign in with your role to see the tools and numbers that matter for your work.</p></div><small style="color:#92A19A">Demo environment. Any password works.</small></div>
<div class="lform"><div class="lbox"><div id="lf" style="margin-bottom:28px"></div><h2>Sign in</h2><p style="color:var(--mu)">Choose how you work at the company.</p>
<div class="roles" id="roles"></div>
<label for="em">Work email</label><input id="em" type="email" value="john@excellium.com">
<label for="pw">Password</label><input id="pw" type="password" value="password123">
<button class="btn p w" id="go">Sign in</button></div></div></div>
<div id="app" class="hide"><aside id="side"><div class="brand" id="bl"></div><nav id="nav" style="display:contents"></nav><div class="me"><b id="mn"></b><span id="mt"></span><br><a id="out" style="padding:6px 0 0;color:#92A19A">Sign out</a></div></aside>
<main><div class="top"><div class="r"><button class="btn menu" id="mb" aria-label="Menu">Menu</button><h2 id="ttl"></h2></div><div class="r"><span class="bd in" id="rb"></span><button class="btn dot" id="nb">Notifications<i id="nc"></i></button></div></div><div id="view"></div></main></div>
<div id="np"></div><div id="mo" class="mo hide"></div>
<script>
const $=s=>document.querySelector(s),ic={dashboard:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',attendance:'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',invoices:'M6 3h9l4 4v14H6zM9 12h7M9 16h7',rankings:'M5 21V10M12 21V4M19 21v-7',meetings:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',equipment:'M4 5h16v11H4zM8 21h8M12 16v5',directory:'M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0',reports:'M4 20V4M4 20h16M8 16l4-5 3 3 5-7',notifications:'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',settings:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-2-4-2 1-2-1V5h-4v2l-2 1-2-1-2 4 2 1v2l-2 1 2 4 2-1 2 1v2h4v-2l2-1 2 1 2-4-2-1z'};

const R={employee:{n:'John Carter',t:'Software Engineer',l:'Employee',d:'Attendance, pay and tasks',nav:'dashboard attendance invoices rankings meetings equipment directory'},
trainer:{n:'Priya Nair',t:'Lead Trainer',l:'Trainer',d:'Cohorts and sessions',nav:'dashboard attendance rankings meetings equipment directory'},
manager:{n:'Daniel Okafor',t:'Operations Manager',l:'Management',d:'Team and approvals',nav:'dashboard attendance invoices rankings meetings equipment directory reports'},
admin:{n:'Sara Malik',t:'Finance and Admin',l:'Finance / Admin',d:'Payroll, assets, system',nav:'dashboard attendance invoices rankings meetings equipment directory reports'}};

const bd=s=>`<span class="bd ${{Approved:'ok',Present:'ok',Confirmed:'ok','On time':'ok',Available:'ok',Pending:'wr',Late:'wr','In repair':'wr','Early departure':'wr','On leave':'in','In use':'in',Rejected:'er',Absent:'er',Missed:'er',Locked:'er',Active:'ok',Idle:'wr','On break':'in'}[s]||'in'}">${s}</span>`;

const hd=(t,p,a='')=>`<div class="hd"><div><h3>${t}</h3><p>${p}</p></div><div>${a}</div></div>`;

const bars=(d,u='')=>{const m=Math.max(...d.map(x=>x[1]));return `<div class="chart">${d.map(x=>`<div><i style="height:${x[1]/m*100}%"></i>${x[0]}</div>`).join('')}</div>`};
const mgr=()=>role=='manager'||role=='admin';
const toast=m=>{const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
const tm=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function modal(t,b,ok,lbl='Save'){const m=$('#mo');m.innerHTML=`<div class="md"><h4>${t}</h4>${b}<div class="mf"><button class="btn" id="mx">Cancel</button><button class="btn p" id="mok">${lbl}</button></div></div>`;m.classList.remove('hide');$('#mx').onclick=()=>m.classList.add('hide');$('#mok').onclick=()=>{if(ok()!==false)m.classList.add('hide')}}
const f=(l,i)=>`<label>${l}</label>${i}`;
const LOGO=()=>`<div class="logo"><svg viewBox="0 0 383 418" aria-hidden="true"><g class="lg"><polygon points="67,0 383,0 320,88 120,88"/><polygon points="67,165 383,165 320,253 120,253"/><polygon points="67,329 383,329 320,418 125,418"/></g><g fill="#7747C7"><polygon points="0,88 67,0 120,88"/><polygon points="0,253 67,165 120,253"/><polygon points="0,418 67,329 125,418"/></g><g fill="#532A9B"><polygon points="0,88 120,88 62,163"/><polygon points="0,253 120,253 62,328"/></g></svg><div><b>EXCELLIUM</b><small>GLOBAL SERVICES</small></div></div>`;
$('#bl').innerHTML=$('#ll').innerHTML=$('#lf').innerHTML=LOGO();
/* ---------- role dashboards ---------- */
const clockCard0=()=>card('Today',`<div class="clock"><div><div class="t" id="tm">--:--:--</div><small style="color:var(--mu)" id="wk">Not clocked in</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="cin()">Clock in</button>${S.brk?'<button class="btn p" onclick="brk()">End break</button>':'<button class="btn" onclick="brk(5)">5 min break</button><button class="btn" onclick="brk(15)">15 min break</button>'}<button class="btn d" onclick="cout()">Clock out</button></div></div>`);
const D={

/* ---------- activity tracking ---------- */
let IDLE=180,LK=[];
const trk=()=>(role=='employee'||role=='trainer')&&!$('#app').classList.contains('hide');
const hm=s=>Math.floor(s/3600)+'h '+String(Math.floor(s/60)%60).padStart(2,'0')+'m';
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const logEv=t=>{S.ev.unshift([new Date(),t]);S.ev=S.ev.slice(0,6)};
const stt=()=>!S.in||S.out?'Offline':S.locked?'Locked':S.brk?'On break':Date.now()-S.last>=5000?'Idle':'Active';
['mousemove','keydown','mousedown','scroll','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(trk()&&S.in&&!S.out&&!S.locked&&!S.brk){S.last=Date.now();S.grace=false}},{passive:true}));
const actCard=()=>card('Activity monitor','<p style="color:var(--mu);margin-bottom:14px;max-width:70ch">While you are clocked in, this portal records mouse, keyboard and touch activity only. It never records what you type or see. Choose a 5 or 15 minute break before you step away. If you are inactive for '+Math.round(IDLE/6)/10+' min, or stay away after a break ends, the portal locks and your manager is notified.</p><div class="grid g4">'+stat('Status','<span id="ast">'+bd(stt())+'</span>','')+stat('Active time','<span id="aact">'+hm(S.act)+'</span>','Mouse or keyboard in use')+stat('Idle time','<span id="aidl">'+hm(S.idle)+'</span>','No input detected')+stat('Break','<span id="abl" style="font-size:20px">'+(S.brk?mmss(Math.max(0,Math.round((S.brkEnd-Date.now())/1000)))+' left':'None active')+'</span>',S.brkUsed.length+' taken today')+'</div>'+(S.ev.length?'<div style="margin-top:14px">'+S.ev.map(e=>`<div class="li"><span>${e[1]}</span><small>${tm(e[0])}</small></div>`).join('')+'</div>':''),S.in&&!S.out?'<span class="bd ok">Monitoring on</span>':'<span class="bd in">Starts when you clock in</span>');
const clockCard=()=>clockCard0()+'<div style="height:16px"></div>'+actCard();
const teamAct=()=>{const rows=[['John Carter',stt(),hm(S.act),hm(S.idle)],['Aisha Khan','Active','6h 10m','0h 22m'],['Marcus Lee','On break','5h 02m','0h 41m'],['Tom Becker','Active','5h 48m','0h 15m'],['Grace Wu','Offline','-','-']];return card('Live activity',tbl(['Employee','Status','Active','Idle'],rows.map(r=>[r[0],bd(r[1]),r[2],r[3]]))+(LK.length?'<h4 style="margin:16px 0 0">Lock-outs</h4>'+LK.map(l=>`<div class="li"><div>${l[0]}<small>${l[2]}</small></div><div style="text-align:right">${tm(l[1])}<small>${l[3]?'Unlocked: '+l[3]:'Still locked'}</small></div></div>`).join(''):'<p style="color:var(--mu);margin-top:12px">No lock-outs today.</p>'))};
function upd(){const g=i=>document.getElementById(i);if(g('ast'))g('ast').innerHTML=bd(stt());if(g('aact'))g('aact').textContent=hm(S.act);if(g('aidl'))g('aidl').textContent=hm(S.idle);if(g('abl'))g('abl').textContent=S.brk?mmss(Math.max(0,Math.round((S.brkEnd-Date.now())/1000)))+' left':'None active';let w=g('wn');if(S.rem&&!S.locked){if(!w){w=document.createElement('div');w.id='wn';document.body.appendChild(w)}w.textContent='Still there? Portal locks in '+S.rem+'s. Move your mouse to stay active.'}else if(w)w.remove()}
function showLock(){const d=document.createElement('div');d.id='lk';d.innerHTML='<div class="md"><div style="width:48px;height:48px;border-radius:14px;background:var(--acs);color:var(--ac);display:grid;place-items:center;margin:0 auto 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><h4>Portal locked</h4><p style="color:var(--mu)">'+LK[0][2]+'. Your manager has been notified.</p>'+f('Reason','<select id="lr"><option>Away from desk</option><option>In a meeting</option><option>Network issue</option><option>Other</option></select>')+f('Password','<input id="lp" type="password" placeholder="Enter your password">')+'<button class="btn p w" id="lu">Unlock portal</button></div>';document.body.appendChild(d);$('#lu').onclick=()=>{if(!$('#lp').value)return toast('Enter your password to unlock');const r=$('#lr').value;LK[0][3]=r;S.locked=false;S.last=Date.now();S.grace=false;logEv('Unlocked: '+r);NT.unshift([R[role].n+' unlocked the portal ('+r+')','Just now',1,1]);d.remove();cnt();toast('Portal unlocked')}}
function lock(){S.locked=true;const nm=R[role].n,why=S.grace?'Did not return after break':'Inactive for '+Math.round(IDLE/6)/10+' min';LK.unshift([nm,new Date(),why,null]);NT.unshift([nm+' was locked out: '+why.toLowerCase(),'Just now',1,1]);logEv('Portal locked');upd();cnt();showLock()}
function tick(){if(!trk()||!S.in||S.out)return;const n=Date.now();S.rem=null;if(S.locked)S.idle++;else if(S.brk){if(n>=S.brkEnd){S.brk=false;S.last=n;S.grace=true;logEv('Break over');toast('Break over. Move your mouse to continue.');go(cur)}}else{const lim=(S.grace?60:IDLE)*1000,gap=n-S.last;if(gap<5000)S.act++;else S.idle++;if(gap>=lim)lock();else if(lim-gap<=30000)S.rem=Math.ceil((lim-gap)/1000)}upd()}
const vis=()=>NT.filter(n=>!n[3]||mgr());
setInterval(tick,1000);
/* ---------- sections ---------- */
const V={dashboard:()=>D[role](),
attendance:()=>{const all=role!='employee';return hd('Attendance',all?'Your log and the team summary.':'Your daily log and monthly summary.','<button class="btn" onclick="dispute()">Raise a correction</button>')+(role=='manager'||role=='admin'?'':clockCard())+`<div class="grid g4" style="margin:16px 0">${stat('Days present','16 / 18','November')}${stat('Late arrivals','2','November')}${stat('Early departures','1','November')}${stat('Leave taken','1 day','November')}</div><div class="grid g2">${card('Hours this week',bars([['Mon',8],['Tue',8.5],['Wed',7.4],['Thu',7.5],['Fri',8.5]]))}${card('Daily log',tbl(['Date','In','Out','Hours','Status'],[...(S.in?[['Today',tm(S.in),S.out?tm(S.out):'-','Running',bd('On time')]]:[]),...LOG.map(l=>[l[0],l[1],l[2],l[3],bd(l[4])])]))}</div>`+(all?'<div style="margin-top:16px">'+(mgr()?teamAct()+'<div style="height:16px"></div>':'')+card('Team today',tbl(['Employee','Department','Status'],P.map(p=>[p[0],p[1],bd(p[2])])))+'</div>':'')},
invoices:()=>{const rows=mgr()?INV:INV.filter(i=>i.e=='John Carter');return hd('Salary invoices',mgr()?'Review and decide on submitted invoices.':'Submit and track your monthly invoices.',(role=='employee'?'<button class="btn p" onclick="newInv()">Submit invoice</button> ':'')+'<button class="btn" onclick="toast(\'Invoice records exported\')">Export records</button>')+card('Invoices',tbl(['ID',...(mgr()?['Employee']:[]),'Month','Amount','Status',''],rows.map(i=>[i.id,...(mgr()?[i.e]:[]),i.m,'$'+i.a.toLocaleString(),bd(i.s),mgr()&&i.s=='Pending'?`<button class="btn s p" onclick="dec('${i.id}','Approved')">Approve</button> <button class="btn s d" onclick="dec('${i.id}','Rejected')">Reject</button>`:i.s=='Rejected'&&!mgr()?'<button class="btn s" onclick="newInv()">Resubmit</button>':''])))+'<div style="margin-top:16px">'+card('Payment history',bars([['Jun',4200],['Jul',4200],['Aug',4000],['Sep',4200],['Oct',4200]]))+'</div>'},
rankings:()=>{const s=[...P].sort((a,b)=>b[3]-a[3]);return hd('Performance and rankings',role=='trainer'?'Trainee and team scores.':'Scores combine attendance, delivery and peer feedback.')+`<div class="grid g2">${card('Leaderboard',s.map((p,i)=>`<div class="li"><span class="pc"><b style="width:20px">${i+1}</b><span class="av">${init(p[0])}</span><span>${p[0]}<small>${p[1]}</small></span></span><span style="width:40%;display:flex;gap:10px;align-items:center"><span class="bar" style="flex:1"><i style="width:${p[3]}%"></i></span><b>${p[3]}</b></span></div>`).join(''))}${card('Score by department',bars([['Eng',89],['Design',96],['Fin',89],['Sales',78],['Ops',87]]))}</div>`},
meetings:()=>hd('Meetings','Upcoming sessions and history.','<button class="btn p" onclick="newMt()">Schedule meeting</button>')+`<div class="grid g2">${card('Upcoming',MT.map(m=>`<div class="li"><div>${m.t}<small>${m.w} · ${m.p}</small></div>${bd(m.s)}</div>`).join(''))}${card('History',tbl(['Meeting','Date','Status',''],[['Weekly sync','6 Nov',bd('Confirmed'),'<button class="btn s" onclick="toast(\'Notes opened\')">Notes</button>'],['Design review','4 Nov',bd('Missed'),''],['Budget check-in','30 Oct',bd('Confirmed'),'<button class="btn s" onclick="toast(\'Notes opened\')">Notes</button>']]))}</div>`,
equipment:()=>{const sel=tab.eqf||'All',inv=INVV.filter(i=>sel=='All'||i[1]==sel);return hd('Equipment and assets','Your devices, requests and company inventory.','<button class="btn p" onclick="newEq()">Request change</button>')+`<div class="grid g2">${card('My equipment',[['MacBook Pro 14"','Apple · M3 · SN C02XK1','Issued 12 Jan 2025'],['Dell U2723QE','Dell · 27" 4K · SN CN8841','Issued 12 Jan 2025']].map(e=>`<div class="li"><div>${e[0]}<small>${e[1]} · ${e[2]}</small></div><button class="btn s" onclick="newEq()">Request</button></div>`).join(''))}${card('Requests',tbl(['ID','Item','Type','Status',''],EQ.filter(e=>mgr()||e.e=='John Carter').map(e=>[e.id,e.i,e.k,bd(e.s),mgr()&&e.s=='Pending'?`<button class="btn s p" onclick="eqd('${e.id}','Approved')">Approve</button> <button class="btn s d" onclick="eqd('${e.id}','Rejected')">Reject</button>`:''])))}</div>`+(mgr()?'<div style="margin-top:16px">'+card('Company inventory',`<select style="width:auto;margin-bottom:10px" onchange="tab.eqf=this.value;go(cur)">${['All','Laptop','Monitor','Phone','Keyboard'].map(o=>`<option ${o==sel?'selected':''}>${o}</option>`).join('')}</select>`+tbl(['Asset','Type','Tag','Assigned to','Status'],inv.map(i=>[i[0],i[1],i[2],i[3],bd(i[4])])))+'</div>':'')},
directory:()=>hd('Employee directory','Find colleagues by name or department.')+`<input id="q" placeholder="Search people" style="max-width:320px;margin-bottom:16px" oninput="dq()"><div class="grid g4" id="dl"></div>`,
reports:()=>{const t=tab.rp||'Attendance',T=['Attendance','Payroll','Performance','Equipment','Meetings'],d={Attendance:[['Mon',44],['Tue',46],['Wed',41],['Thu',43],['Fri',39]],Payroll:[['Jun',182],['Jul',184],['Aug',179],['Sep',186],['Oct',187]],Performance:[['Eng',89],['Design',96],['Fin',89],['Sales',78],['Ops',87]],Equipment:[['Laptop',52],['Monitor',48],['Phone',22],['Other',18]],Meetings:[['W1',31],['W2',38],['W3',35],['W4',42]]}[t];return hd('Reports and analytics','Company-wide trends.','<button class="btn" onclick="toast(\'Report exported\')">Export</button>')+`<div class="tabs">${T.map(x=>`<button class="${x==t?'on':''}" onclick="tab.rp='${x}';go('reports')">${x}</button>`).join('')}</div>`+card(t+' trend',bars(d))},
notifications:()=>hd('Notifications','Everything sent to you.','<button class="btn" onclick="NT.forEach(n=>n[2]=0);go(cur);cnt()">Mark all read</button>')+card('Inbox',vis().map(n=>`<div class="li"><div>${n[2]?'<b>'+n[0]+'</b>':n[0]}<small>${n[1]}</small></div>${n[2]?'<span class="bd in">New</span>':''}</div>`).join('')),
settings:()=>{const T=['Profile','Security','Notifications',...(role=='admin'?['Organization','Roles','Audit logs']:[])],t=T.includes(tab.st)?tab.st:'Profile',u=R[role];const tg=a=>a.map(x=>`<div class="tg">${x}<input type="checkbox" checked></div>`).join('');const B={Profile:f('Full name',`<input value="${u.n}">`)+f('Email',`<input value="${$('#em').value}">`)+f('Job title',`<input value="${u.t}">`),Security:f('Current password','<input type="password">')+f('New password','<input type="password">')+tg(['Two-factor authentication']),Notifications:tg(['Email alerts','Invoice updates','Meeting reminders','Equipment request updates']),Organization:f('Company name','<input value="Excellium Global Services">')+f('Work week','<select><option>Mon to Fri</option></select>')+f('Standard start time','<input value="09:00">')+f('Lock portal after inactivity (minutes)','<input type="number" min="1" max="60" value="'+Math.round(IDLE/6)/10+'" onchange="IDLE=Math.max(60,(+this.value||3)*60)">'),Roles:tbl(['Role','Users','Can approve'],[['Employee',30,'No'],['Trainer',6,'No'],['Management',8,'Invoices, assets'],['Finance / Admin',4,'Everything']]),'Audit logs':tbl(['Time','Actor','Action'],[['10:42','Sara Malik','Approved INV-1042'],['09:15','Daniel Okafor','Changed role'],['Yesterday','System','Backup completed']])};return hd('Settings','Account and workspace preferences.')+`<div class="tabs">${T.map(x=>`<button class="${x==t?'on':''}" onclick="tab.st='${x}';go('settings')">${x}</button>`).join('')}</div>`+card(t,B[t]+(['Roles','Audit logs'].includes(t)?'':'<div class="mf"><button class="btn p" onclick="toast(\'Changes saved\')">Save changes</button></div>'))}};
/* ---------- actions ---------- */
const dec=(id,s)=>{INV.find(i=>i.id==id).s=s;toast('Invoice '+s.toLowerCase());go(cur)},eqd=(id,s)=>{EQ.find(i=>i.id==id).s=s;toast('Request '+s.toLowerCase());go(cur)};
const cin=()=>{if(S.in&&!S.out)return toast('Already clocked in');S.in=new Date();S.out=null;S.last=Date.now();S.grace=false;S.locked=false;logEv('Clocked in');toast('Clocked in at '+tm(S.in));go(cur)},cout=()=>{if(!S.in)return toast('Clock in first');S.out=new Date();S.brk=false;logEv('Clocked out');toast('Clocked out at '+tm(S.out));go(cur)},brk=m=>{if(!S.in||S.out)return toast('Clock in first');if(S.brk){S.brk=false;S.last=Date.now();S.grace=false;logEv('Break ended early');toast('Welcome back');return go(cur)}S.brk=true;S.brkEnd=Date.now()+m*60000;S.brkUsed.push(m);logEv(m+' min break started');toast(m+' minute break started');go(cur)};
const dispute=()=>modal('Raise a correction','<p style="color:var(--mu)">Tell your manager what needs fixing.</p>'+f('Date','<input type="date">')+f('Reason','<textarea rows="3"></textarea>'),()=>toast('Correction request sent'),'Send request');

const dq=()=>{const q=($('#q').value||'').toLowerCase();$('#dl').innerHTML=P.filter(p=>(p[0]+p[1]).toLowerCase().includes(q)).map(p=>`<div class="card pc"><span class="av">${init(p[0])}</span><div>${p[0]}<small style="color:var(--mu);display:block">${p[1]}</small>${bd(p[2])}</div></div>`).join('')||'<p style="color:var(--mu)">No one matches that search.</p>'};
const cnt=()=>{const n=vis().filter(x=>x[2]).length;$('#nc').textContent=n;$('#nc').classList.toggle('hide',!n);$('#np').innerHTML=`<div class="hd"><h3>Notifications</h3><button class="btn s" onclick="$('#np').classList.remove('open')">Close</button></div>`+vis().map(n=>`<div class="li"><div>${n[0]}<small>${n[1]}</small></div></div>`).join('')};
